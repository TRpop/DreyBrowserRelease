<title id="t">Four AI features</title><desc id="d">AI Agent works in a project folder with approvals; Ask about this page opens a question pane that uses Claude Code or Codex on this PC; a web chatbot opens in the side view and gets page text only when you copy it as Markdown and paste; MCP lets an outside AI app operate only in a group you lend, and you can take it back.</desc>
