<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<title id="t">DREY AI — the browser assistant</title><desc id="d">The DREY AI button left of the address bar opens the assistant and takes you back to your tab. One conversation is shared by every window. An example request adds a weekly meeting; a confirmation card follows your settings. Memory is looked up as an index first. Other apps can request to add events, approved on one card. On the right: Schedule with a calendar and a repeating event, Tasks with decided, open and result items, and Files with outputs, saved items and recent storage.</desc>
