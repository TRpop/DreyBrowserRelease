<text x="496" y="44" font-size="11" font-weight="600" fill="#7a4fd6" text-anchor="start">← press again to go back to your tab</text>
<text x="48" y="88" font-size="12" font-weight="600" fill="#6b7385" text-anchor="start">One conversation in every window</text>
