<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<title id="t">Work groups: archive and export</title><desc id="d">A group menu with Archive group and Export to file. Archived groups wait in the Archive; an exported .dreygroup file can be imported later.</desc>
