<rect x="40" y="180" width="4" height="18" rx="2" fill="#2f6fde"/><text x="50" y="193" font-size="11.5" font-weight="600" fill="#2f6fde" text-anchor="start">Q4 report</text><rect x="48" y="207" width="14" height="14" rx="3" fill="#2f6fde"/><text x="68" y="219" font-size="11.5" font-weight="400" fill="#6b7385" text-anchor="start">Sales dashboard</text>
<rect x="230" y="66" width="170" height="150" rx="10" fill="#fff" stroke="#d5dae3" filter="url(#sh)"/>
<text x="246" y="89" font-size="11.5" font-weight="400" fill="#6b7385" text-anchor="start">New tab in this group</text>
<text x="246" y="117" font-size="11.5" font-weight="400" fill="#6b7385" text-anchor="start">Rename · Color</text>
<text x="246" y="145" font-size="11.5" font-weight="400" fill="#6b7385" text-anchor="start">Description</text>
