<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/></filter></defs>
<rect x="20" y="20" width="400" height="290" rx="12" fill="#ffffff" stroke="#d5dae3"/><path d="M20 32 a12 12 0 0 1 12 -12 h376 a12 12 0 0 1 12 12 v22 h-400 z" fill="#f6f7f9"/><line x1="20" y1="54" x2="420" y2="54" stroke="#d5dae3"/><circle cx="38" cy="37.0" r="4" fill="#d5dae3"/><circle cx="52" cy="37.0" r="4" fill="#d5dae3"/><circle cx="66" cy="37.0" r="4" fill="#d5dae3"/><rect x="90" y="30" width="250" height="14" rx="7.0" fill="#fff" stroke="#d5dae3"/><text x="104" y="41.0" font-size="11" font-weight="400" fill="#6b7385" text-anchor="start">Vertical tabs</text>
